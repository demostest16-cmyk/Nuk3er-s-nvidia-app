name: build

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore NvForge.sln

      - name: Build
        run: dotnet build NvForge.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/NvForge.Core.Tests/NvForge.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish single-file EXE
        run: >
          dotnet publish src/NvForge.App/NvForge.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=false
          -o publish

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NvForge-win-x64
          path: publish/NvForge.exe
          if-no-files-found: error

  release:
    # Publishes a GitHub Release with the EXE. Runs when a vX.Y.Z tag is pushed,
    # or when the workflow is dispatched manually / via API (the action creates
    # the tag server-side, so no tag push is required).
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish
        run: >
          dotnet publish src/NvForge.App/NvForge.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=false
          -o publish
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          name: NvForge v0.5.0 (beta)
          prerelease: true
          generate_release_notes: true
          files: publish/NvForge.exe
          body: |
            **NvForge** — all-in-one NVIDIA GPU manager for Windows (desktop + laptop GPUs).

            Download **`NvForge.exe`** below and run it as Administrator. It's a single
            self-contained executable (the .NET runtime is bundled); no install needed.
            Run with `--simulate` to try the UI on a machine without an NVIDIA GPU.

            Tabs: Dashboard · Monitoring · Tuning · NVIDIA Settings · Driver Customization ·
            Windows Tweaks · Diagnostics.

            ⚠️ **Beta.** The NVAPI write paths (overclocking and NVIDIA Control Panel
            settings) are built from public definitions and not yet validated on real
            hardware — they fail safely if unsupported, and changes are reversible. Laptop
            GPUs are typically vendor-locked. Please report issues via the Diagnostics tab.
